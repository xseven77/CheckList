<title>婚礼筹备清单</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* 布局：竖向时间线，左列日期、右列事项与清单；顶部吸附进度条和模式切换 */
:root {
  --bg: #faf7f6;
  --surface: #ffffff;
  --ink: #2b1f21;
  --muted: #7c6d6f;
  --line: #eadedd;
  --red: #b0262f;
  --on-red: #ffffff;
  --red-soft: #f8e5e5;
  --gold: #946a1e;
  --display: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161112; --surface: #201a1b; --ink: #f3eaea; --muted: #a8999a; --line: #3a2e30;
    --red: #ec6a70; --on-red: #2a0b0e; --red-soft: #3a1d20; --gold: #d8ab5a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161112; --surface: #201a1b; --ink: #f3eaea; --muted: #a8999a; --line: #3a2e30;
  --red: #ec6a70; --on-red: #2a0b0e; --red-soft: #3a1d20; --gold: #d8ab5a; color-scheme: dark;
}

body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.6 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 112px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; }

.top { padding-block: 28px 14px; display: flex; gap: 14px; align-items: center; }
.seal {
  flex: none; width: 52px; height: 52px; border-radius: 10px; display: grid; place-items: center;
  background: var(--red); color: var(--on-red); font: 700 30px/1 var(--display);
}
h1 { font: 700 28px/1.25 var(--display); margin: 0; letter-spacing: .03em; text-wrap: balance; }
.lede { color: var(--muted); margin: 2px 0 0; font-size: 14px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-block: 10px; border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
}
.prog { flex: 1 1 240px; min-width: 0; }
.track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--red); transition: width .3s ease; }
.prog-text { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 5px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.prog-text b { color: var(--ink); font-weight: 600; }
.actions { display: flex; gap: 8px; }
.sync { flex-basis: 100%; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.sync[data-s="ok"]::before { background: #3a9a62; }
.sync[data-s="err"] { color: var(--red); }
.sync[data-s="err"]::before { background: var(--red); }

.btn {
  font: inherit; font-size: 15px; min-height: 44px; padding: 0 18px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.btn.primary { background: var(--red); border-color: var(--red); color: var(--on-red); font-weight: 600; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn.danger { background: var(--red); border-color: var(--red); color: var(--on-red); }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

.edit-banner {
  margin-top: 12px; padding: 10px 14px; border-radius: var(--r); background: var(--red-soft);
  color: var(--ink); font-size: 14px;
}
body:not(.editing) .edit-only { display: none !important; }
body.editing .view-only { display: none !important; }

.day { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 14px; padding-block: 26px 0; }
.date { text-align: center; color: var(--red); font: 700 36px/1 var(--display); }
.date .unit { font-size: 15px; margin-left: 1px; }
.date small { display: block; margin-top: 8px; font: 500 12.5px/1 var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
.events { border-left: 2px solid var(--line); padding-left: 18px; display: grid; gap: 20px; min-width: 0; }
.event { position: relative; min-width: 0; }
.event::before {
  content: ""; position: absolute; left: -26px; top: 15px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--bg); border: 2px solid var(--red);
}
.event.done::before { background: var(--red); }
.time { display: block; font-size: 12.5px; font-weight: 600; letter-spacing: .05em; color: var(--gold); font-variant-numeric: tabular-nums; }
.task { display: flex; gap: 12px; align-items: center; min-height: 44px; cursor: pointer; }
.task .title { font-size: 16.5px; font-weight: 600; line-height: 1.4; }
.event.done .title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--red); }
.note { margin: 0 0 0 34px; color: var(--muted); font-size: 14px; }
.direct { margin-left: 34px; }

input[type="checkbox"] { width: 22px; height: 22px; margin: 0; flex: none; accent-color: var(--red); cursor: pointer; }

.sec { margin-top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.sec > summary {
  list-style: none; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px;
  font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary .name { flex: 1; min-width: 0; }
.count { font-size: 12.5px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.count.full { color: var(--red); }
.chev { width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg) translateY(-3px); transition: transform .2s; flex: none; }
.sec[open] .chev { transform: rotate(-135deg) translateY(-1px); }
.sec-body { padding: 0 14px 8px; }

.grp { padding-block: 6px; border-top: 1px dashed var(--line); }
.grp:first-child { border-top: 0; }
.grp-label { font-size: 12.5px; letter-spacing: .08em; color: var(--muted); padding-top: 4px; }
.items { display: grid; }
.item { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-height: 44px; }
.item label { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.item .t { overflow-wrap: anywhere; }
.item input:checked + .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--red); }
.item .ops { display: flex; gap: 2px; }
.item .editor { flex: 1 1 160px; min-width: 0; }

.field {
  font: inherit; font-size: 16px; min-height: 44px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; box-sizing: border-box;
}
.add { display: flex; gap: 8px; padding-block: 6px 4px; }
.add .field { flex: 1; min-width: 0; }
.confirm {
  flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 10px 12px; margin-bottom: 6px; border-radius: 10px; background: var(--red-soft);
}
.confirm p { flex-basis: 100%; margin: 0; font-size: 14px; }

.toast {
  position: fixed; z-index: 20; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(440px, calc(100vw - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px;
  background: var(--ink); color: var(--bg); border-radius: 14px; box-shadow: 0 6px 24px rgb(0 0 0 / .18);
}
.toast span { flex: 1; min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
.toast .btn { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); }

.preview {
  position: fixed; inset: 0; z-index: 30; overflow: auto; background: var(--bg);
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.preview-bar { max-width: 760px; margin: 0 auto 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.preview-bar p { flex-basis: 100%; margin: 0; font-size: 13px; color: var(--muted); }
.preview img { display: block; width: 100%; max-width: 760px; height: auto; margin: 0 auto; border: 1px solid var(--line); border-radius: 8px; }

@media (max-width: 540px) {
  h1 { font-size: 24px; }
  .seal { width: 44px; height: 44px; font-size: 26px; }
  .actions { width: 100%; }
  .actions .btn { flex: 1; }
  .day { grid-template-columns: 1fr; gap: 8px; }
  .date { text-align: left; display: flex; align-items: baseline; gap: 10px; font-size: 30px; }
  .date small { display: inline; margin: 0; }
  .events { margin-left: 5px; padding-left: 16px; }
  .event::before { left: -24px; }
  .note, .direct { margin-left: 0; }
  .sec-body { padding: 0 12px 6px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="seal" aria-hidden="true">囍</div>
    <div>
      <h1>婚礼筹备清单</h1>
      <p class="lede">3—7 号 · 行程、搬运物资与随身用品</p>
    </div>
  </header>

  <div class="bar">
    <div class="prog">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="prog-text"><span>事项 <b id="cTask">0/0</b></span><span>明细 <b id="cItem">0/0</b></span></div>
    </div>
    <div class="actions">
      <button type="button" class="btn primary" id="modeBtn" aria-pressed="false">编辑</button>
      <button type="button" class="btn" id="exportBtn">导出长图</button>
    </div>
    <div class="sync" id="sync" data-s="wait" role="status">正在读取共享记录…</div>
  </div>

  <div class="edit-banner edit-only">编辑中：可以增加、修改、删除明细。改完点“完成”回到查看状态。</div>

  <main id="days"></main>
</div>

<div class="toast" id="toast" hidden><span id="toastText"></span><button type="button" class="btn sm" id="undoBtn">撤销</button></div>

<script>
(() => {
  // ---------- 原始计划（用户提供的清单） ----------
  const PLAN = [
    { day: 3, events: [
      { id: 'e3a', time: '上午', title: '宾客名单与婚礼素材', groups: [
        { id: 'g3a', items: ['确认宾客名单', '婚纱照（注明哪一张用于迎宾）', '开场视频', '打包到百度云发出去'] } ] },
      { id: 'e3b', time: '17:30 出发', title: '货拉拉运物资 → 摩格俪', secs: [
        { id: 's3b', title: '伴手礼、桌糖与现场物资', groups: [
          { id: 'g3b', label: '糖与礼物', items: ['伴手礼 75 份', '桌糖 173 盒', '玩具 60 个', '抽奖礼物 10 个', '彩票 20 张'] },
          { id: 'g3c', label: '喜字贴', items: ['喜字贴 15 个（贴桌糖盒下面，每桌一个）'] },
          { id: 'g3d', label: '酒与烟', items: ['剑南春 16 瓶', '烟 3 条', '散烟（每桌 2 包）'] },
          { id: 'g3e', label: '迎宾布置', items: ['奶油奶盖迎宾 KT 板'] } ] } ] },
      { id: 'e3c', time: '19:00', title: '彩排', note: '嘟嘟在场', groups: [{ id: 'g3f', items: [] }] } ] },
    { day: 4, events: [
      { id: 'e4a', time: '当天', title: '家里打扫卫生', groups: [{ id: 'g4a', items: ['换红色四件套'] }] } ] },
    { day: 5, events: [
      { id: 'e5a', time: '10:00 前', title: '和妈妈做美甲', groups: [{ id: 'g5a', items: [] }] },
      { id: 'e5b', time: '11:00', title: '宁波 → 杭州，接舅妈', groups: [{ id: 'g5b', items: [] }] },
      { id: 'e5c', time: '晚上', title: '餐厅吃饭', groups: [{ id: 'g5c', items: [] }] } ] },
    { day: 6, events: [
      { id: 'e6a', time: '上午', title: '取婚纱与礼服', secs: [
        { id: 's6a', title: '取衣清单', groups: [
          { id: 'g6a', label: '女生', items: ['主纱', '主头纱', '晨袍', '敬酒服', '女生西装全套'] },
          { id: 'g6b', label: '男生', items: ['黑色中式礼服', '男生婚纱', '男生头纱'] } ] } ] },
      { id: 'e6b', time: '13:00 到达', title: '摩格俪 · 送服装', groups: [
        { id: 'g6c', label: '带去', items: ['主纱', '主头纱', '敬酒服', '红色高跟鞋'] } ] },
      { id: 'e6c', time: '下午', title: '南苑环球酒店 · 带用品与布置道具', secs: [
        { id: 's6b', title: '新娘用品', groups: [
          { id: 'g6d', label: '身体护理', items: ['脱毛刀', '磨砂膏', '身体乳', '止汗露'] },
          { id: 'g6e', label: '护肤卸妆', items: ['面膜 ×5', '唇膏', '卸妆油', '护肤品'] },
          { id: 'g6f', label: '妆容眼部', items: ['美瞳', '润眼液', '粉底液', '眉笔', '散粉', 'YSL 镜面唇釉', '阿玛尼正红唇釉'] },
          { id: 'g6g', label: '首饰', items: ['珍珠耳钉', '假项链', '假手镯', '金项链', '金手镯', '牡丹耳钉'] },
          { id: 'g6h', label: '贴身衣物', items: ['胸贴', '收腹提臀裤', '内衣', '内裤', '睡衣睡裤', '背背佳'] },
          { id: 'g6i', label: '鞋服配件', items: ['金色高跟鞋', '蕾丝高跟鞋', '团扇', '透明伞', '红色阿迪鞋（外景穿）', '便服、拖鞋（中午吃饭穿）'] } ] },
        { id: 's6c', title: '新郎用品', groups: [
          { id: 'g6j', label: '个人准备', items: ['腋下管理', '眼镜框', '隐形眼镜'] },
          { id: 'g6k', label: '服装鞋履', items: ['睡衣睡裤', '西装', '领带', '西装袜', '8cm 皮鞋', '便服', '洞洞鞋'] },
          { id: 'g6l', label: '红包喜糖', items: ['大吉大利红包', '喜糖 30 份'] } ] },
        { id: 's6d', title: '酒店布置道具', groups: [
          { id: 'g6m', label: '搬运支撑', items: ['露营车', '橙子篮筐', '橙子', '支架'] },
          { id: 'g6n', label: '工具胶材', items: ['剪刀', '电工剪', '小刀', '透明胶', '红色、黑色扎带', '美纹纸', '热熔胶', '拖线板', '双面胶', '点点胶'] },
          { id: 'g6o', label: '布艺花艺', items: ['红丝绒布', '假花', '插花泡沫', '插花渔网', '如意抱枕', '喜字抱枕', '红色十件套'] },
          { id: 'g6p', label: '装饰陈设', items: ['歪头大喜字', '红色 PDD 大杂烩装饰品', '托盘', '星星人礼盒', '金色 KT 板喜字', '大小灯笼', 'YES I DO KT 板', '喜结良缘卷轴', '黄色油纸伞 6 把'] },
          { id: 'g6q', label: '仪式茶点', items: ['礼炮', '礼花', '四宫格托盘（红枣、开心果、桂圆、花生）', '敬茶托盘', '红色一次性纸杯', '茶叶', '小瓶矿泉水 1 箱（贴喜字）'] },
          { id: 'g6r', label: '拍摄', items: ['富士 XT5', '拍立得 + 相纸'] } ] } ] },
      { id: 'e6d', time: '晚上', title: '宁宁接送奶盖去洗澡', groups: [{ id: 'g6s', items: [] }] } ] },
    { day: 7, events: [
      { id: 'e7a', time: '上午', title: '把奶盖的用品带到酒店', groups: [{ id: 'g7a', items: ['奶盖的礼服', '红色胸背'] }] } ] },
  ];

  // ---------- 状态 ----------
  const CACHE_KEY = 'wedding-checklist-v1';
  const OPEN_KEY = 'wedding-checklist-open-v1';
  const state = { groups: {}, tasks: {} };
  const groupMeta = {};      // gid -> { label, eventId, secId, day }
  const listEls = {};        // gid -> 列表容器
  const taskEls = {};        // eid -> 复选框
  const busy = new Set();    // 正在修改或确认删除的分组，暂不重绘
  const dirty = new Set();
  let editing = false;
  let lastDeleted = null;

  const allGroups = ev => [...(ev.groups || []), ...(ev.secs || []).flatMap(s => s.groups)];
  PLAN.forEach(d => d.events.forEach(ev => {
    state.tasks[ev.id] = false;
    (ev.groups || []).forEach(g => { groupMeta[g.id] = { label: g.label || '', eventId: ev.id, secId: null, day: d.day }; });
    (ev.secs || []).forEach(s => s.groups.forEach(g => { groupMeta[g.id] = { label: g.label || '', eventId: ev.id, secId: s.id, day: d.day }; }));
    allGroups(ev).forEach(g => { state.groups[g.id] = g.items.map((t, i) => ({ id: g.id + '-' + i, t, d: false })); });
  }));

  function cleanItems(raw) {
    if (!Array.isArray(raw) || raw.length > 200) return null;
    const out = [];
    for (const it of raw) {
      if (!it || typeof it.t !== 'string' || typeof it.id !== 'string') return null;
      out.push({ id: it.id.slice(0, 40), t: it.t.slice(0, 160), d: it.d === true });
    }
    return out;
  }
  function readJSON(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch { return null; } }
  function writeJSON(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }

  const cached = readJSON(CACHE_KEY);
  if (cached && typeof cached === 'object') {
    for (const gid in cached.groups || {}) { const items = groupMeta[gid] && cleanItems(cached.groups[gid]); if (items) state.groups[gid] = items; }
    for (const eid in cached.tasks || {}) if (eid in state.tasks) state.tasks[eid] = cached.tasks[eid] === true;
  }
  const openState = readJSON(OPEN_KEY) || {};

  // ---------- 保存与同步 ----------
  const syncEl = document.getElementById('sync');
  let db = null, dbFailed = false;
  const pending = new Set();            // db 连接前产生的修改
  const queues = {};                    // 每个文档一次只写一个
  function setSync(s, text) { syncEl.dataset.s = s; syncEl.textContent = text; }
  const SYNC_OK = '已同步 · 打开这个页面的人看到同一份清单';
  const SYNC_LOCAL = '只保存在这台设备上 · 登录 Claude 打开后可多人同步';

  function persist(path) {
    writeJSON(CACHE_KEY, state);
    if (!db) { if (!dbFailed) pending.add(path); return; }
    write(path);
  }
  function docData(path) {
    const [kind, id] = path.split('/');
    return kind === 'groups' ? { items: state.groups[id], at: Date.now() } : { done: state.tasks[id], at: Date.now() };
  }
  function write(path) {
    const q = queues[path] || (queues[path] = { running: false, again: false });
    if (q.running) { q.again = true; return; }
    q.running = true;
    setSync('wait', '保存中…');
    db.doc(path).set(docData(path)).then(() => {
      setSync('ok', SYNC_OK);
    }).catch(err => {
      setSync('err', err && (err.code === 'not_granted' || err.code === 'revoked')
        ? '你没有修改权限，勾选只保存在这台设备上'
        : '同步没成功，请检查网络后刷新页面');
    }).finally(() => {
      q.running = false;
      if (q.again) { q.again = false; write(path); }
    });
  }

  async function connect() {
    let api = null;
    try { api = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch { api = null; }
    if (!api) { dbFailed = true; setSync('local', SYNC_LOCAL); return; }
    db = api;
    pending.forEach(write); pending.clear();
    let loaded = 0;
    const timer = setTimeout(() => { if (loaded < 2) setSync('err', '共享记录读取超时，请检查网络后刷新页面'); }, 10000);
    const done = () => { if (++loaded === 2) { clearTimeout(timer); setSync('ok', SYNC_OK); } };
    const fail = err => { clearTimeout(timer); setSync('err', '读取共享记录失败，显示的是这台设备上的记录'); };
    let gFirst = true, tFirst = true;
    db.collection('groups').onSnapshot(snap => {
      snap.docs.forEach(doc => {
        if (!doc.exists || !groupMeta[doc.id] || queues['groups/' + doc.id]?.running) return;
        const items = cleanItems(doc.data()?.items);
        if (!items) return;
        state.groups[doc.id] = items; renderGroup(doc.id);
      });
      writeJSON(CACHE_KEY, state); updateCounts();
      if (gFirst) { gFirst = false; done(); }
    }, fail);
    db.collection('tasks').onSnapshot(snap => {
      snap.docs.forEach(doc => {
        if (!doc.exists || !(doc.id in state.tasks) || queues['tasks/' + doc.id]?.running) return;
        state.tasks[doc.id] = doc.data()?.done === true;
      });
      syncTasks(); writeJSON(CACHE_KEY, state); updateCounts();
      if (tFirst) { tFirst = false; done(); }
    }, fail);
  }

  // ---------- 渲染 ----------
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const dayCountEls = {}, secCountEls = {}, eventEls = {};

  function buildGroup(g, parent) {
    const wrap = el('div', 'grp');
    if (g.label) wrap.append(el('div', 'grp-label', g.label));
    const list = el('div', 'items');
    listEls[g.id] = list;
    const form = el('form', 'add edit-only');
    const input = el('input', 'field');
    input.type = 'text'; input.maxLength = 160; input.id = 'add-' + g.id; input.enterKeyHint = 'done';
    input.placeholder = g.label ? '增加到「' + g.label + '」' : '增加一条明细';
    input.setAttribute('aria-label', input.placeholder);
    const btn = el('button', 'btn sm', '＋ 增加'); btn.type = 'submit';
    form.append(input, btn);
    form.addEventListener('submit', e => {
      e.preventDefault();
      const t = input.value.trim(); if (!t) { input.focus(); return; }
      state.groups[g.id].push({ id: 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t, d: false });
      input.value = ''; renderGroup(g.id); updateCounts(); persist('groups/' + g.id); input.focus();
    });
    wrap.append(list, form);
    parent.append(wrap);
    renderGroup(g.id);
    return wrap;
  }

  function renderGroup(gid) {
    if (busy.has(gid)) { dirty.add(gid); return; }
    const list = listEls[gid]; if (!list) return;
    list.replaceChildren();
    const items = state.groups[gid];
    items.forEach((item, index) => {
      const row = el('div', 'item');
      const label = el('label');
      const cb = el('input'); cb.type = 'checkbox'; cb.checked = item.d; cb.id = 'cb-' + item.id;
      cb.addEventListener('change', () => { item.d = cb.checked; updateCounts(); persist('groups/' + gid); });
      label.append(cb, el('span', 't', item.t));
      const ops = el('div', 'ops edit-only');
      const edit = el('button', 'btn sm quiet', '修改'); edit.type = 'button'; edit.setAttribute('aria-label', '修改 ' + item.t);
      const del = el('button', 'btn sm quiet', '删除'); del.type = 'button'; del.setAttribute('aria-label', '删除 ' + item.t);
      ops.append(edit, del);
      row.append(label, ops);
      edit.addEventListener('click', () => startEdit(gid, item, row));
      del.addEventListener('click', () => askDelete(gid, item, row, del));
      list.append(row);
    });
  }

  function release(gid) { busy.delete(gid); dirty.delete(gid); renderGroup(gid); updateCounts(); }

  function startEdit(gid, item, row) {
    busy.add(gid);
    const input = el('input', 'field editor'); input.type = 'text'; input.value = item.t; input.maxLength = 160;
    input.id = 'edit-' + item.id; input.setAttribute('aria-label', '修改明细内容'); input.enterKeyHint = 'done';
    const save = el('button', 'btn sm primary', '保存'); save.type = 'button';
    const cancel = el('button', 'btn sm quiet', '取消'); cancel.type = 'button';
    row.replaceChildren(input, save, cancel); input.focus(); input.select();
    const commit = () => {
      const t = input.value.trim(); if (!t) { input.focus(); return; }
      const changed = t !== item.t; item.t = t; release(gid);
      if (changed) persist('groups/' + gid);
    };
    save.addEventListener('click', commit);
    cancel.addEventListener('click', () => release(gid));
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); commit(); }
      if (e.key === 'Escape') release(gid);
    });
  }

  function askDelete(gid, item, row, delBtn) {
    if (row.querySelector('.confirm')) return;
    busy.add(gid);
    const box = el('div', 'confirm'); box.setAttribute('role', 'group'); box.setAttribute('aria-label', '删除确认');
    box.append(el('p', '', '确定删除“' + item.t + '”吗？'));
    const yes = el('button', 'btn sm danger', '确认删除'); yes.type = 'button';
    const no = el('button', 'btn sm', '取消'); no.type = 'button';
    box.append(yes, no); row.append(box); no.focus();
    yes.addEventListener('click', () => {
      const items = state.groups[gid]; const index = items.indexOf(item);
      if (index >= 0) items.splice(index, 1);
      lastDeleted = { gid, index, item };
      release(gid); persist('groups/' + gid);
      showToast('已删除“' + item.t + '”');
    });
    no.addEventListener('click', () => release(gid));
  }

  const toast = document.getElementById('toast'), toastText = document.getElementById('toastText');
  let toastTimer = 0;
  function showToast(text) {
    toastText.textContent = text; toast.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast.hidden = true; lastDeleted = null; }, 8000);
  }
  document.getElementById('undoBtn').addEventListener('click', () => {
    if (!lastDeleted) return;
    const { gid, index, item } = lastDeleted; lastDeleted = null;
    const items = state.groups[gid];
    items.splice(Math.min(Math.max(index, 0), items.length), 0, item);
    renderGroup(gid); updateCounts(); persist('groups/' + gid);
    toast.hidden = true; clearTimeout(toastTimer);
  });

  function syncTasks() {
    for (const eid in taskEls) { taskEls[eid].checked = state.tasks[eid]; eventEls[eid].classList.toggle('done', state.tasks[eid]); }
  }

  function build() {
    const root = document.getElementById('days');
    PLAN.forEach(d => {
      const sec = el('section', 'day'); sec.setAttribute('aria-label', d.day + ' 号');
      const date = el('div', 'date'); date.append(String(d.day), el('span', 'unit', '号'));
      const dc = el('small'); dayCountEls[d.day] = dc; date.append(dc);
      const events = el('div', 'events');
      d.events.forEach(ev => {
        const box = el('div', 'event'); eventEls[ev.id] = box;
        box.append(el('span', 'time', ev.time));
        const task = el('label', 'task');
        const cb = el('input'); cb.type = 'checkbox'; cb.id = 'task-' + ev.id; taskEls[ev.id] = cb;
        cb.addEventListener('change', () => { state.tasks[ev.id] = cb.checked; box.classList.toggle('done', cb.checked); updateCounts(); persist('tasks/' + ev.id); });
        task.append(cb, el('span', 'title', ev.title));
        box.append(task);
        if (ev.note) box.append(el('p', 'note', ev.note));
        if (ev.groups) { const direct = el('div', 'direct'); ev.groups.forEach(g => buildGroup(g, direct)); box.append(direct); }
        (ev.secs || []).forEach(s => {
          const det = el('details', 'sec'); det.open = openState[s.id] !== false;
          det.addEventListener('toggle', () => { openState[s.id] = det.open; writeJSON(OPEN_KEY, openState); });
          const sum = el('summary'); const cnt = el('span', 'count'); secCountEls[s.id] = cnt;
          sum.append(el('span', 'name', s.title), cnt, el('span', 'chev'));
          const body = el('div', 'sec-body'); s.groups.forEach(g => buildGroup(g, body));
          det.append(sum, body); box.append(det);
        });
        events.append(box);
      });
      sec.append(date, events); root.append(sec);
    });
    syncTasks();
  }

  function updateCounts() {
    let ti = 0, td = 0, ii = 0, id = 0;
    const perDay = {}, perSec = {};
    for (const eid in state.tasks) { ti++; if (state.tasks[eid]) td++; }
    for (const gid in state.groups) {
      const m = groupMeta[gid], items = state.groups[gid], n = items.length, k = items.filter(i => i.d).length;
      ii += n; id += k;
      const pd = perDay[m.day] || (perDay[m.day] = [0, 0]); pd[0] += k; pd[1] += n;
      if (m.secId) { const ps = perSec[m.secId] || (perSec[m.secId] = [0, 0]); ps[0] += k; ps[1] += n; }
    }
    PLAN.forEach(d => d.events.forEach(ev => { const pd = perDay[d.day] || (perDay[d.day] = [0, 0]); pd[1]++; if (state.tasks[ev.id]) pd[0]++; }));
    document.getElementById('cTask').textContent = td + '/' + ti;
    document.getElementById('cItem').textContent = id + '/' + ii;
    const total = ti + ii;
    document.getElementById('fill').style.width = (total ? (td + id) / total * 100 : 0) + '%';
    for (const day in dayCountEls) { const [a, b] = perDay[day] || [0, 0]; dayCountEls[day].textContent = a + '/' + b; }
    for (const sid in secCountEls) { const [a, b] = perSec[sid] || [0, 0]; secCountEls[sid].textContent = a + '/' + b; secCountEls[sid].classList.toggle('full', b > 0 && a === b); }
  }

  // ---------- 查看 / 编辑切换 ----------
  const modeBtn = document.getElementById('modeBtn');
  modeBtn.addEventListener('click', () => {
    editing = !editing;
    document.body.classList.toggle('editing', editing);
    modeBtn.textContent = editing ? '完成' : '编辑';
    modeBtn.setAttribute('aria-pressed', String(editing));
    if (!editing) { [...busy].forEach(release); }
  });

  // ---------- 导出长图 ----------
  const exportBtn = document.getElementById('exportBtn');
  exportBtn.addEventListener('click', async () => {
    exportBtn.disabled = true; exportBtn.textContent = '正在生成…';
    try {
      try { await document.fonts.load('700 40px "Noto Serif SC"', '婚礼筹备清单囍'); } catch {}
      const blob = await drawImage();
      showPreview(blob);
    } catch (e) {
      setSync('err', e && e.message === 'too-long' ? '清单太长，删掉一些明细后再导出' : '长图生成失败，请再试一次');
    } finally {
      exportBtn.disabled = false; exportBtn.textContent = '导出长图';
    }
  });

  function drawImage() {
    const W = 1080, S = 2;   // 2 倍像素，手机上看清楚
    const P = { bg: '#fbf7f5', ink: '#2b1f21', muted: '#85777a', line: '#e8dad9', red: '#b0262f', gold: '#946a1e', card: '#ffffff' };
    const sans = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif';
    const serif = '"Noto Serif SC", "Songti SC", "STSong", serif';
    const meas = document.createElement('canvas').getContext('2d');
    const ops = []; let y = 0;
    function wrapText(text, width, font) {
      meas.font = font; const rows = []; let line = '';
      for (const ch of text) {
        if (line && meas.measureText(line + ch).width > width) { rows.push(line); line = ch; } else line += ch;
      }
      if (line) rows.push(line); return rows;
    }
    function text(value, x, width, size, color, weight = 400, family = sans, lh = 1.5) {
      const font = weight + ' ' + size + 'px ' + family;
      for (const row of wrapText(value, width, font)) { ops.push({ k: 't', s: row, x, y, font, color }); y += size * lh; }
    }
    const L = 64, DATE_W = 96, LINE_X = L + DATE_W, CX = LINE_X + 32, CW = W - CX - 64;

    y = 64;
    ops.push({ k: 'seal', x: L, y });
    const ty = y; y += 6; text('婚礼筹备清单', L + 92, W - L - 92 - 64, 44, P.ink, 700, serif, 1.3);
    text('3—7 号 · 行程、搬运物资与随身用品', L + 92, W - L - 92 - 64, 22, P.muted);
    y = Math.max(y, ty + 76) + 18;
    let ti = 0, td = 0, ii = 0, id = 0;
    for (const e in state.tasks) { ti++; if (state.tasks[e]) td++; }
    for (const g in state.groups) { ii += state.groups[g].length; id += state.groups[g].filter(i => i.d).length; }
    text('事项 ' + td + '/' + ti + ' · 明细 ' + id + '/' + ii + ' · ✓ 表示已完成', L, W - 2 * L, 22, P.muted);
    y += 10; ops.push({ k: 'hr', y }); y += 34;

    PLAN.forEach(d => {
      const start = y;
      ops.push({ k: 't', s: String(d.day), x: L + 6, y: y - 4, font: '700 52px ' + serif, color: P.red });
      ops.push({ k: 't', s: '号', x: L + 6 + (d.day >= 10 ? 60 : 32), y: y + 20, font: '700 22px ' + serif, color: P.red });
      d.events.forEach(ev => {
        const top = y; const done = state.tasks[ev.id];
        ops.push({ k: 'dot', x: LINE_X, y: top + 34, filled: done });
        text(ev.time, CX, CW, 20, P.gold, 600);
        text((done ? '✓ ' : '') + ev.title, CX, CW, 30, done ? P.muted : P.ink, 600);
        if (ev.note) text(ev.note, CX, CW, 22, P.muted);
        const drawGroup = (g, x, w) => {
          const items = state.groups[g.id]; if (!items.length) return;
          const value = items.map(i => (i.d ? '✓ ' : '') + i.t).join(' · ');
          if (g.label) {
            const t0 = y; text(g.label, x, 130, 22, P.muted); const end = y; y = t0;
            text(value, x + 140, w - 140, 24, P.ink, 400, sans, 1.55); y = Math.max(y, end);
          } else text(value, x, w, 24, P.ink, 400, sans, 1.55);
          y += 8;
        };
        if (ev.groups) { y += 4; ev.groups.forEach(g => drawGroup(g, CX, CW)); }
        (ev.secs || []).forEach(s => {
          if (!s.groups.some(g => state.groups[g.id].length)) return;
          y += 10; const boxTop = y; ops.push({ k: 'box', x: CX - 4, y: boxTop, w: CW + 8, h: 0, ref: null });
          const boxOp = ops[ops.length - 1];
          y += 18; text(s.title, CX + 18, CW - 36, 24, P.ink, 600); y += 6;
          s.groups.forEach(g => drawGroup(g, CX + 18, CW - 36));
          y += 8; boxOp.h = y - boxTop;
        });
        y += 30;
      });
      ops.push({ k: 'vline', x: LINE_X, y1: start + 30, y2: y - 30 });
      y += 22;
    });
    y += 10; text('导出于 ' + new Date().toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }), L, W - 2 * L, 20, P.muted);
    y += 40;
    if (y * S > 32000) throw new Error('too-long');

    const c = document.createElement('canvas'); c.width = W * S; c.height = Math.ceil(y * S);
    const ctx = c.getContext('2d'); if (!ctx) throw new Error('canvas');
    ctx.scale(S, S); ctx.textBaseline = 'top';
    ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, y);
    const round = (x, yy, w, h, r) => { ctx.beginPath(); ctx.moveTo(x + r, yy); ctx.arcTo(x + w, yy, x + w, yy + h, r); ctx.arcTo(x + w, yy + h, x, yy + h, r); ctx.arcTo(x, yy + h, x, yy, r); ctx.arcTo(x, yy, x + w, yy, r); ctx.closePath(); };
    ops.filter(o => o.k === 'box').forEach(o => { round(o.x, o.y, o.w, o.h, 14); ctx.fillStyle = P.card; ctx.fill(); ctx.strokeStyle = P.line; ctx.lineWidth = 1.5; ctx.stroke(); });
    ops.filter(o => o.k === 'vline').forEach(o => { ctx.strokeStyle = P.line; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(o.x, o.y1); ctx.lineTo(o.x, o.y2); ctx.stroke(); });
    for (const o of ops) {
      if (o.k === 't') { ctx.font = o.font; ctx.fillStyle = o.color; ctx.fillText(o.s, o.x, o.y); }
      else if (o.k === 'hr') { ctx.fillStyle = P.line; ctx.fillRect(L, o.y, W - 2 * L, 2); }
      else if (o.k === 'dot') { ctx.beginPath(); ctx.arc(o.x, o.y, 9, 0, Math.PI * 2); ctx.fillStyle = o.filled ? P.red : P.bg; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = P.red; ctx.stroke(); }
      else if (o.k === 'seal') { round(o.x, o.y, 72, 72, 14); ctx.fillStyle = P.red; ctx.fill(); ctx.fillStyle = '#ffffff'; ctx.font = '700 44px ' + serif; ctx.textAlign = 'center'; ctx.fillText('囍', o.x + 36, o.y + 13); ctx.textAlign = 'start'; }
    }
    return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/png'));
  }

  let downloadsApi;
  const downloadsReady = (async () => { try { downloadsApi = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch { downloadsApi = null; } })();

  async function showPreview(blob) {
    const url = URL.createObjectURL(blob);
    const ov = el('div', 'preview'); ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', '长图预览');
    const bar = el('div', 'preview-bar');
    const save = el('button', 'btn primary', '保存图片'); save.type = 'button'; save.hidden = true;
    const close = el('button', 'btn', '关闭'); close.type = 'button';
    const tip = el('p', '', '手机上也可以长按图片保存到相册。');
    bar.append(save, close, tip);
    const img = el('img'); img.src = url; img.alt = '婚礼筹备清单长图';
    ov.append(bar, img); document.body.append(ov);
    const prev = document.body.style.overflow; document.body.style.overflow = 'hidden';
    const dismiss = () => { ov.remove(); URL.revokeObjectURL(url); document.body.style.overflow = prev; document.removeEventListener('keydown', onKey); exportBtn.focus(); };
    const onKey = e => { if (e.key === 'Escape') dismiss(); };
    document.addEventListener('keydown', onKey);
    close.addEventListener('click', dismiss);
    close.focus();
    await downloadsReady;
    if (downloadsApi) {
      save.hidden = false;
      save.addEventListener('click', async () => {
        save.disabled = true;
        try { await downloadsApi.save({ filename: '婚礼筹备清单.png', data: blob }); tip.textContent = '已保存。'; }
        catch (e) {
          if (e && e.code === 'declined') tip.textContent = '已取消保存。';
          else if (e && e.code === 'rate_limited') tip.textContent = '保存窗口已经打开，请先处理它。';
          else { tip.textContent = '这里不能直接保存，请长按图片保存。'; save.hidden = true; }
        } finally { save.disabled = false; }
      });
    }
  }

  build();
  updateCounts();
  connect();
})();
</script>
